# docker compose up --build
# Then seed demo data once:  docker compose exec web python -m app.seed
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg2://bidboard:bidboard@db:5432/bidboard
  CELERY_BROKER_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:-change-me-before-deploying}
  SCHEDULE_WITH_CELERY: "1"   # queue an exact-deadline task for every auction
  EMBEDDED_SWEEPER: "0"       # Celery beat does the sweeping instead

services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: bidboard, POSTGRES_PASSWORD: bidboard, POSTGRES_DB: bidboard }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U bidboard"], interval: 3s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, timeout: 3s, retries: 20 }
  web:
    build: .
    environment: *app-env
    ports: ["8000:8000"]
    volumes: [uploads:/srv/uploads]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build: .
    command: celery -A app.tasks worker -l info
    environment: *app-env
    depends_on: { web: { condition: service_healthy } }
  beat:
    build: .
    command: celery -A app.tasks beat -l info
    environment: *app-env
    depends_on: { web: { condition: service_healthy } }

volumes:
  pgdata:
  uploads:
